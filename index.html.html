<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ইংরেজি টেস্ট স্কোর তুলনা – Moves Education BD</title>
<style>
:root {
  --bg: #F4F7F9;
  --surface: #FFFFFF;
  --ink: #132238;
  --muted: #56667A;
  --line: #D5DDE6;
  --accent: #0B6B6B;
  --accent-ink: #FFFFFF;
  --soft: #E2F0EF;
  --wa: #128C4A;
  --warn: #7A4E00;
  --warn-bg: #FFF3D6;
  --warn-line: #EBCF8E;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1620; --surface: #152130; --ink: #E8EEF5; --muted: #97A7BA; --line: #2A3B4E;
    --accent: #52C7C0; --accent-ink: #062321; --soft: #12312F; --wa: #4CD08A;
    --warn: #F2C878; --warn-bg: #2A2110; --warn-line: #5A4718;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1620; --surface: #152130; --ink: #E8EEF5; --muted: #97A7BA; --line: #2A3B4E;
  --accent: #52C7C0; --accent-ink: #062321; --soft: #12312F; --wa: #4CD08A;
  --warn: #F2C878; --warn-bg: #2A2110; --warn-line: #5A4718;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.chips > .chip-btn { margin: 0 8px 8px 0; }
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; margin-top: 12px; }
.tblwrap table { border-collapse: collapse; width: 100%; min-width: 460px; font-size: 0.92rem; }
.tblwrap th, .tblwrap td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tblwrap thead th { background: var(--bg); color: var(--muted); font-weight: 600; }
.tblwrap tbody tr:last-child th, .tblwrap tbody tr:last-child td { border-bottom: 0; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", "Nirmala UI", "Kohinoor Bangla", "Bangla Sangam MN", Arial, sans-serif;
  font-size: 16px; line-height: 1.6; font-variant-numeric: lining-nums tabular-nums;
}
main { max-width: 640px; margin: 0 auto; padding: 18px 16px 48px; padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
.brand { font-weight: 700; font-size: 1.02rem; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.lang button {
  font: inherit; font-size: 0.9rem; font-weight: 600; padding: 6px 14px; border: 0; background: transparent; color: var(--ink); cursor: pointer; min-height: 40px;
}
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

h1 { font-size: clamp(1.5rem, 6vw, 2rem); line-height: 1.3; margin: 0 0 8px; font-weight: 700; }
.lede { margin: 0 0 20px; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.label { font-size: 0.92rem; font-weight: 600; color: var(--muted); margin-bottom: 8px; display: block; }
.step + .step { margin-top: 18px; }

.chips { display: flex; flex-wrap: wrap; }
.chip-btn {
  font: inherit; font-size: 0.95rem; font-weight: 600; padding: 9px 14px; min-height: 44px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--ink); cursor: pointer;
}
.chip-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.ruler { display: grid; grid-template-columns: repeat(6, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.band {
  font: inherit; font-weight: 600; font-size: 1.05rem; min-height: 52px; border: 0;
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  background: var(--bg); color: var(--ink); cursor: pointer;
}
.band:nth-child(6n) { border-right: 0; }
.band:nth-last-child(-n+5) { border-bottom: 0; }
.band[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

input[type="number"] {
  font: inherit; font-size: 1.2rem; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-height: 52px; width: 100%;
}
.hint { font-size: 0.86rem; color: var(--muted); margin-top: 6px; }

.chip-btn:focus-visible, .band:focus-visible, input:focus-visible, .lang button:focus-visible, .cta a:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}

.result { margin-top: 16px; }
.headline { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.headline .k { color: var(--muted); font-weight: 600; }
.headline .big { font-size: clamp(3.2rem, 16vw, 4.6rem); font-weight: 300; line-height: 1; letter-spacing: -0.03em; }
.level { margin-top: 10px; }
.level .pill { display: inline-block; padding: 3px 10px; border-radius: 6px; background: var(--soft); color: var(--accent); font-weight: 700; margin-right: 8px; }
.level span.txt { color: var(--muted); font-size: 0.95rem; }
.note { margin: 12px 0 0; color: var(--muted); font-size: 0.93rem; }
.msg { padding: 12px 14px; border-radius: 8px; background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.cell { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--bg); }
.cell .t { font-size: 0.82rem; color: var(--muted); font-weight: 600; }
.cell .v { font-size: 1.5rem; font-weight: 600; margin-top: 2px; }
.cell.mine { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cell .tag { display: block; font-size: 0.75rem; color: var(--accent); font-weight: 700; }

.cta { margin-top: 18px; border: 1px solid var(--accent); border-radius: 12px; padding: 16px; background: var(--soft); }
.cta h2 { font-size: 1.05rem; margin: 0 0 6px; }
.cta p { margin: 0 0 12px; color: var(--ink); font-size: 0.95rem; }
.cta .btns { display: flex; gap: 10px; flex-wrap: wrap; }
.cta a {
  display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 700;
  min-height: 48px; padding: 10px 18px; border-radius: 10px;
}
.cta a.wa { background: var(--wa); color: #fff; }
.cta a.call { border: 1px solid var(--accent); color: var(--accent); background: var(--surface); }
:root[data-theme="dark"] .cta a.wa { color: #062321; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cta a.wa { color: #062321; } }

.fine { margin-top: 20px; font-size: 0.85rem; color: var(--muted); }
.fine p { margin: 0 0 8px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand" id="brand"></div>
    <div class="lang" role="group" aria-label="Language">

</main>

    }
  };

  var lang = "bn";
  var state = { test: "ielts", value: TESTS.ielts.def };

  function $(s) { return document.querySelector(s); }
  function f1(n) { return Number(n).toFixed(1); }
  function T() { return TXT[lang]; }
  function fmtR(r) {
    if (!r) return "—";
    if (r[0] === 0) return T().upTo + r[1];
    return r[0] === r[1] ? String(r[0]) : r[0] + "–" + r[1];
  }
  function unionR(bands, key) {
    var rs = bands.map(function (b) { return b[key]; }).filter(Boolean);
    if (!rs.length) return null;
    return [Math.min.apply(null, rs.map(function (r) { return r[0]; })), Math.max.apply(null, rs.map(function (r) { return r[1]; }))];
  }
  function ieltsText(bands) {
    var lo = bands[0].b, hi = bands[bands.length - 1].b;
    return lo === hi ? f1(lo) : f1(lo) + "–" + f1(hi);
  }
  function tnText(bands) {
    var v = bands.map(function (b) { return b.tn; });
    var lo = Math.min.apply(null, v), hi = Math.max.apply(null, v);
    return lo === hi ? f1(lo) : f1(lo) + "–" + f1(hi);
  }
  function levels(bands) {
    var out = [];
    bands.forEach(function (b) { if (out.indexOf(b.cefr) === -1) out.push(b.cefr); });
    return out;
  }
  function ascending(list) { return list.slice().sort(function (a, b) { return a.b - b.b; }); }

  // ---- lookup ----
  function resolve(test, v) {
    var t = TESTS[test], bands, r;
    if (test === "ielts") {
      bands = BANDS.filter(function (x) { return x.b === v; });
      return bands.length ? { bands: bands } : { err: "enter" };
    }
    if (isNaN(v)) return { err: "enter" };
    if (v < t.min || v > t.max) return { err: "range" };
    if (test === "tn") {
      if (Math.round(v * 2) !== v * 2) return { err: "half" };
      bands = BANDS.filter(function (x) { return x.tn === v; });
      if (bands.length) return { bands: ascending(bands) };
      var below = BANDS.filter(function (x) { return x.tn <= v; });
      if (!below.length) return { err: "belowTn" };
      return { bands: [below[0]], note: { type: "between", v: f1(v), b: f1(below[0].b) } };
    }
    bands = BANDS.filter(function (x) { r = x[test]; return r && v >= r[0] && v <= r[1]; });
    if (!bands.length) {
      if (test === "pte") return { err: "belowPte" };
      if (test === "det") return { err: "belowDet" };
      return { err: "enter" };
    }
    bands = ascending(bands);
    if (bands.length > 1) return { bands: bands, note: { type: "span", r: ieltsText(bands) } };
    r = bands[0][test];
    if (r[1] > r[0]) {
      var frac = (v - r[0]) / (r[1] - r[0]);
      if (frac >= 0.75) return { bands: bands, note: { type: "upper", b: f1(bands[0].b), r: fmtR(r) } };
      if (frac <= 0.25) return { bands: bands, note: { type: "lower", b: f1(bands[0].b), r: fmtR(r) } };
    }
    return { bands: bands };
  }

  // ---- render ----
  function renderStatic() {
    var t = T();
    document.documentElement.lang = lang === "bn" ? "bn" : "en";
    document.title = t.title + " – " + CONFIG.brand;
    $("#brand").textContent = CONFIG.brand;
    $("#h1").textContent = t.title;
    $("#lede").textContent = t.lede;
    $("#lblTest").textContent = t.lblTest;
    $("#lang-bn").setAttribute("aria-pressed", lang === "bn");
    $("#lang-en").setAttribute("aria-pressed", lang === "en");
    var chips = "";
    ORDER.forEach(function (k) {
      chips += '<button type="button" class="chip-btn" data-t="' + k + '" aria-pressed="' + (k === state.test) + '">' + t.test[k] + "</button>";
    });
    $("#chips").innerHTML = chips;
    $("#chips").querySelectorAll(".chip-btn").forEach(function (b) {
      b.addEventListener("click", function () {
        state.test = b.getAttribute("data-t");
        state.value = TESTS[state.test].def;
        renderStatic(); renderInput(); renderResult();
      });
    });
    $("#fine").innerHTML = t.fine.map(function (p) { return "<p>" + p + "</p>"; }).join("");
  }

  function renderInput() {
    var t = T(), box = $("#inputBox"), cfg = TESTS[state.test];
    if (state.test === "ielts") {
      var html = '<span class="label" id="lblBand">' + t.lblIelts + '</span><div class="ruler" role="group" aria-labelledby="lblBand">';
      BANDS.slice().reverse().forEach(function (b) {
        html += '<button type="button" class="band" data-b="' + b.b + '" aria-pressed="' + (b.b === state.value) + '">' + f1(b.b) + "</button>";
      });
      box.innerHTML = html + "</div>";
      box.querySelectorAll(".band").forEach(function (btn) {
        btn.addEventListener("click", function () {
          state.value = parseFloat(btn.getAttribute("data-b"));
          box.querySelectorAll(".band").forEach(function (x) { x.setAttribute("aria-pressed", x === btn ? "true" : "false"); });
          renderResult();
        });
      });
    } else {
      box.innerHTML = '<label class="label" for="scoreIn">' + t.lblScore + '</label><input id="scoreIn" type="number" inputmode="decimal" min="' + cfg.min + '" max="' + cfg.max + '" step="' + cfg.step + '" value="' + state.value + '"><div class="hint">' + t.hint[state.test] + "</div>";
      $("#scoreIn").addEventListener("input", function () {
        state.value = parseFloat(this.value);
        renderResult();
      });
    }
  }

  function contactHtml(bands) {
    var t = T();
    var wa = (CONFIG.whatsapp || "").replace(/\D/g, "");
    var ph = (CONFIG.phone || "").replace(/\D/g, "");
    if (!wa && !ph) return "";
    var html = '<div class="cta"><h2>' + t.ctaTitle + "</h2><p>" + t.ctaBody + '</p><div class="btns">';
    if (wa) {
      var val = state.test === "ielts" ? f1(state.value) : String(state.value);
      var msg = t.waMsg(t.test[state.test], val, ieltsText(bands));
      html += '<a class="wa" target="_blank" rel="noopener" href="https://wa.me/' + wa + "?text=" + encodeURIComponent(msg) + '">' + t.wa + "</a>";
    }
    if (ph) html += '<a class="call" href="tel:+' + ph + '">' + t.call + "</a>";
    return html + "</div></div>";
  }

  function renderResult() {
    var t = T(), box = $("#result");
    var res = resolve(state.test, state.value);
    if (res.err) {
      var m = t.err[res.err];
      if (res.err === "range") m = m(TESTS[state.test].min, TESTS[state.test].max);
      box.innerHTML = '<div class="result"><div class="msg" role="status">' + m + "</div></div>";
      return;
    }
    var bands = res.bands;
    var cells = [
      ["tn", tnText(bands)],
      ["to", fmtR(unionR(bands, "to"))],
      ["pte", fmtR(unionR(bands, "pte"))],
      ["det", fmtR(unionR(bands, "det"))]
    ];
    var lv = levels(bands);
    var html = '<div class="result">';
    html += '<div class="headline"><span class="k">' + t.equals + '</span><span class="big">' + ieltsText(bands) + "</span></div>";
    html += '<div class="level">' + lv.map(function (c) { return '<span class="pill">CEFR ' + c + '</span><span class="txt">' + t.level[c] + "</span>"; }).join(" ") + "</div>";
    if (res.note) {
      var n = res.note, nt = n.type === "span" ? t.note.span(n.r) : n.type === "between" ? t.note.between(n.v, n.b) : t.note[n.type](n.b, n.r);
      html += '<p class="note">' + nt + "</p>";
    }
    html += '<div class="grid">';
    cells.forEach(function (c) {
      var mine = c[0] === state.test;
      html += '<div class="cell' + (mine ? " mine" : "") + '"><div class="t">' + t.cell[c[0]] + '</div><div class="v">' + c[1] + "</div>" + (mine ? '<span class="tag">' + t.mine + "</span>" : "") + "</div>";
    });
    html += "</div>" + contactHtml(bands) + "</div>";
    box.innerHTML = html;
  }

  function setLang(l) {
    lang = l;
    renderStatic(); renderInput(); renderResult();
  }
  $("#lang-bn").addEventListener("click", function () { setLang("bn"); });
  $("#lang-en").addEventListener("click", function () { setLang("en"); });

  renderStatic(); renderInput(); renderResult();
})();
</script>
</body>
</html>
